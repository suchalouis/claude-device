; Claude Pad — M5Stack Core2
; Affiche l'état de Claude Code (via hooks HTTP) et répond à ses demandes
; (permission, question, plan) depuis l'écran tactile, via pad-prompt.py.

[env:m5stack-core2]
platform = espressif32@^6.9.0
board = m5stack-core2
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

; 16 Mo de flash : on prend une table de partitions qui laisse de la place
; (Wi-Fi + serveur web + polices UTF-8 dépassent la partition app par défaut).
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5Unified@^0.2.2
    bblanchon/ArduinoJson@^7.2.0
